<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Register – League of Silent Flight</title>
    <link rel="stylesheet" href="../assets/css/site.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>Create an Account</h2>
      <form id="register-form" method="POST">
        <div class="input-group">
          <input type="text" name="username" placeholder="Username" required />
        </div>
        <div class="input-group">
          <input type="email" name="email" placeholder="Email" required />
        </div>
        <div class="input-group">
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          />
        </div>
        <div class="input-group">
          <input
            type="password"
            name="confirm"
            placeholder="Confirm Password"
            required
          />
        </div>
        <div
          class="g-recaptcha"
          data-sitekey="6LeoIR8sAAAAANlcFoBZvfbDf6sonK7DfLgS6B2S"
        ></div>
        <button class="login-btn" type="submit" id="register-btn">
          Register
        </button>
      </form>
      <p style="text-align: center">
        <a class="forgot-link" href="../pages/login.htm" target="main"
          >Already have an account? Log in</a
        >
      </p>
    </div>

    <script>
      const form = document.getElementById("register-form");
      const host = window.location.hostname;
      const registerBtn = document.getElementById("register-btn");

      if (host === "localhost" || host === "127.0.0.1") {
        form.action = "../dev/register.php";
      } else {
        form.action = "../includes/register.php";
      }
      form.addEventListener("submit", function () {
        registerBtn.disabled = true;
        registerBtn.textContent = "Registering...";
        registerBtn.classList.add("loading"); // optional CSS hook
      });
    </script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  </body>
</html>
